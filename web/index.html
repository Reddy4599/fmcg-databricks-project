<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMCG Analytics</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172522;background:#f3f7f5}
    *{box-sizing:border-box}body{margin:0}header{background:#123f34;color:white;padding:32px max(24px,calc((100vw - 1180px)/2))}header p{margin:6px 0 0;color:#c5dfd5}
    main{max-width:1180px;margin:auto;padding:26px 20px 60px}.cards,.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:20px}.card,.panel{background:white;border:1px solid #dbe7e0;border-radius:14px;box-shadow:0 3px 14px #123f3409;padding:20px}.card b{display:block;font-size:1.7rem;margin-top:10px;color:#12604a}.label{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:#5f746d}.panel h2{font-size:1.05rem;margin:0 0 16px}.panel{min-height:260px}.barrow{display:grid;grid-template-columns:150px 1fr 100px;align-items:center;gap:12px;margin:12px 0;font-size:.88rem}.bartrack{height:13px;background:#e6f1eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#1e9470;border-radius:99px}.amount{text-align:right;font-variant-numeric:tabular-nums}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.89rem}td,th{padding:10px;border-bottom:1px solid #e4ece8;text-align:left}th{color:#55736a}tr:last-child td{border-bottom:0}.wide{grid-column:1/-1}.error{color:#9a3427}
    @media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.charts{grid-template-columns:1fr}.barrow{grid-template-columns:100px 1fr 80px}}
  </style>
</head>
<body>
  <header><h1>FMCG Analytics</h1><p>Validated orders → sales insights · Local reproducible demo</p></header>
  <main><div class="cards" id="cards"></div><div class="charts"><section class="panel"><h2>Monthly revenue</h2><div id="monthly"></div></section><section class="panel"><h2>Revenue by category</h2><div id="category"></div></section><section class="panel"><h2>Revenue by channel</h2><div id="channel"></div></section><section class="panel"><h2>Top products</h2><div id="product"></div></section><section class="panel wide"><h2>Customers</h2><div id="customer"></div></section><section class="panel wide"><h2>Data quality and source batches</h2><div id="quality"></div></section></div></main>
  <script>
    const rupees=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v/100);
    const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function bars(id,rows,label){const max=Math.max(1,...rows.map(x=>x.revenue_cents));document.getElementById(id).innerHTML=rows.length?rows.map(x=>`<div class="barrow"><span>${escape(x[label])}</span><div class="bartrack"><div class="bar" style="width:${100*x.revenue_cents/max}%"></div></div><span class="amount">${rupees(x.revenue_cents)}</span></div>`).join(''):'No data';}
    function table(rows,cols){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${escape(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${escape(c[2]?c[2](r[c[0]]):r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    fetch('/api/data').then(r=>{if(!r.ok)throw Error(r.statusText);return r.json()}).then(d=>{
      const s=d.summary;const kpis=[['Revenue',new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(s.revenue_inr)],['Orders',s.orders],['Quantity sold',s.quantity],['Customers',s.customers],['Products',s.products]];
      document.getElementById('cards').innerHTML=kpis.map(x=>`<div class="card"><span class="label">${x[0]}</span><b>${x[1]}</b></div>`).join('');
      bars('monthly',d.monthly.sort((a,b)=>a.month.localeCompare(b.month)),'month');bars('category',d.category,'category');bars('channel',d.channel,'channel');bars('product',d.product,'product_name');
      document.getElementById('customer').innerHTML=table(d.customer,[['customer','Customer'],['city','City'],['channel','Channel'],['quantity','Quantity'],['revenue_cents','Revenue',rupees]]);
      document.getElementById('quality').innerHTML=`<p><strong>${s.rejected}</strong> rejected source rows. Invalid rows do not enter sales totals.</p>`+table(d.batches,[['source_file','Order file'],['records_read','Read'],['records_accepted','Accepted'],['records_rejected','Rejected']])+(d.rejections.length?'<h3>Rejected rows</h3>'+table(d.rejections,[['source_file','Source'],['record_id','Record'],['reason','Reason']]):'');
    }).catch(e=>document.getElementById('cards').innerHTML=`<p class="error">Could not load analytics: ${escape(e.message)}</p>`);
  </script>
</body>
</html>
